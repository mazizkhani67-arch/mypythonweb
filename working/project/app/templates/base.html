<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>خانه | شرکت مهندسی</title>
  <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
  <img class="to_top" id="toTop" aria-label="بازگشت به بالا"
        src = "{{url_for('static',filename='icon/up.png')}}">
      
        <img class="contact_us" id="contact" aria-label="تماس با ما" 
        src="{{url_for('static',filename='icon/call.png')}}" 
        data_url="{{url_for('main.contact')}}">
        <img class="about_us" id="aboutus" aria-label="درباره ما" 
        src = "{{url_for('static',filename='icon/info.png')}}"
        data_url = "{{url_for('main.about')}}">
        <img class="m_services" id="mservices" aria-label="خدمات" 
        src = "{{url_for('static',filename='icon/services.png')}}"
        data_url = "{{url_for('main.services')}}">
        
        <script>
          const btn=document.getElementById('toTop')
          window.addEventListener('scroll',()=> {
            btn.style.opacity = window.scrollY > 300 ? '1' : '0';
            btn.style.pointerEvents = window.scrollY > 300 ? 'auto' : 'none';
          });
          btn.addEventListener('click',()=>{
            window.scrollTo({top: 0,behavior: 'smooth'});
          })
          const call1=document.getElementById('contact')
          const url1 = call1.getAttribute('data_url')
          
          call1.addEventListener('click',()=>{
            window.open(url1)
          })
          const about1=document.getElementById('aboutus')
          const url2 = about1.getAttribute('data_url')
          
          
          about1.addEventListener('click',()=>{
            window.open(url2)
          })
          const services1 = document.getElementById('mservices')
          const url3 = services1.getAttribute('data_url')
          
          services1.addEventListener('click',()=>{
            window.open(url3)
          })
          
        </script>
  <div class="shadow ">
    
      
        <img  class="logo" id="mlogo" src="{{url_for('static',filename='logo/logo4.jpg')}}"
        data_url = "{{url_for('main.home')}}"> 
       <script>
        const logo2=document.getElementById('mlogo')
        const url4 = logo2.getAttribute('data_url')

          logo2.addEventListener('click',()=>{
            window.open(url4)
          })
       </script>
      
   
   
  </div>
  
</head>
<body>

        
        
        {% block content %}

        {% endblock %}
        <nav>
          <p class="designer">
              طراحی سایت توسط مهندس محمد عزیزخانی
          </p>      
        </nav>
        
    </body>
   
</html>
