<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>به وب‌سایت ما خوش آمدید!</title>
    <!-- اصلاح شده: url_for مستقیماً در href قرار گرفته -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel=""
</head>
<body>
    <div class="container2">
        <div class="image-container">
            <!-- اصلاح شده: url_for مستقیماً در src قرار گرفته -->
            <img id="animated-image" src="{{ url_for('static', filename='img/landing.png') }}" 
            alt="تصویر خوش‌آمدگویی" data_url ="{{ url_for('main.home') }}"> 
            <!-- توجه: اگر main.home یک blueprint است، این درست است. اگر نه، فقط home را استفاده کنید. -->
        </div>
        <h1>به زودی...</h1>
        <p>لطفاً کمی صبر کنید. صفحه اصلی وب‌سایت ما در حال بارگذاری است.</p>
    </div>

    <script>
        const animatedImage = document.getElementById('animated-image');
        const redirectTime = 3000; // 5 ثانیه انتظار
        // استفاده از آدرس صفحه اصلی که از attribute تصویر گرفته شده
        const homePageUrl = animatedImage.getAttribute('data_url'); 

        // افزودن کلاس برای انیمیشن fade-in پس از بارگذاری کامل صفحه
        window.addEventListener('load', () => {
            // مطمئن شوید کلاس fade-in در CSS تعریف شده است
            animatedImage.classList.add('fade-in'); 
        });

        // هدایت کاربر پس از زمان مشخص شده
        setTimeout(() => {
            window.location.href = homePageUrl;
        }, redirectTime);
    </script>
</body>
</html>
