{% extends "base.html" %}

{% block title %}خدمات{% endblock %}

<div class="container mt-4">
    <h2>خدمات ما</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">تبدیل مختصات UTM</h5>
                    <p class="card-text">

            </div>
        </div>
        
        <!-- سایر سرویس‌ها -->

                    با کلیک روی نقشه، مختصات UTM را دریافت و ذخیره کنید
                </p>
                <a href="{{ url_for('main.utm_picker') }}" class="btn btn-primary">
                    شروع کنید
                </a>
            </div>
            </div>
        </div>
    </div>
